[project]
name = "udmm2"
version = "0.1.0"
description = "UDMM 2.0 Cognitive Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="UDMM Team"}]
dependencies = [
  "pydantic>=2.6",
  "networkx>=3.3",
  "numpy>=1.26",
  "typing-extensions>=4.9"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
